bundle:
  name: maven_market_lakehouse

# Define bundle-level variables for dynamic deployment across environments
variables:
  catalog_name: 
    description: "Target Unity Catalog Metastore name"
    default: "maven_market_uc"
  env:
    description: "Deployment target environment name"
    default: "dev"
  secret_scope:
    description: "Databricks secret scope for storing sensitive information"
    default: "scope-maven-market"
  prod_workspace_host:
    description: "Production Databricks workspace URL; required when deploying the prod target"
    default: "https://adb-7405609703883364.4.azuredatabricks.net"

# Configuration for deployment targets (Dev vs Prod)
targets:
  dev:
    mode: development
    default: true
    workspace:
      # Update with your Azure Databricks workspace URL
      host: https://adb-7405609703883364.4.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: dev
    resources:
      pipelines:
        dlt_medallion_pipeline:
          development: true

  prod:
    mode: production
    workspace:
      host: ${var.prod_workspace_host}
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod
    permissions:
      - level: CAN_MANAGE
        group_name: "admins"

# Define workspace resource deployments (DLT Pipelines & Orchestration Workflows)
resources:
  # 1. Delta Live Tables Medallion Pipeline
  pipelines:
    dlt_medallion_pipeline:
      name: ${bundle.name}_dlt_pipeline_${var.env}
      catalog: ${var.catalog_name}
      target: ${var.env}
      continuous: false
      development: false
      serverless: true
      channel: CURRENT
      edition: ADVANCED
      photon: true
      environment:
        dependencies:
          - "pymongo>=4.5.0"
          - "pandas>=2.0.0"
          - "PyYAML>=6.0.1"
      libraries:
        - notebook:
            path: ./src/dlt/01_bronze.py
        - notebook:
            path: ./src/dlt/02_silver.py
        - notebook:
            path: ./src/dlt/03_gold.py
      configuration:
        bundle.environment: ${var.env}
        catalog_name: ${var.catalog_name}
        spark.databricks.delta.streaming.ignoreChanges.enabled: "true"

  # 2. Daily Workflow Orchestration Job (Serverless)
  jobs:
    lakehouse_daily_workflow:
      name: ${bundle.name}_daily_job_${var.env}
      
      # Top-level resource tags (moved from cluster custom_tags)
      tags:
        project: maven_market
        environment: ${var.env}
        owner: telemetry_team

      schedule:
        quartz_cron_expression: "0 0 2 * * ?" # Runs daily at 2:00 AM UTC
        timezone_id: UTC
        pause_status: UNPAUSED

      # Environment definition required for serverless Python script execution
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - "PyYAML>=6.0.1"

      tasks:
        # Task 1: Trigger DLT Pipeline Transformation
        - task_key: run_medallion_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_medallion_pipeline.id}

        # Task 2: Audit & Telemetry Log Aggregation (Serverless)
        - task_key: run_telemetry_audit
          run_if: ALL_DONE
          depends_on:
            - task_key: run_medallion_dlt
          environment_key: default
          spark_python_task:
            python_file: ./src/telemetry/run_audit.py
            parameters:
              - "--pipeline-id"
              - ${resources.pipelines.dlt_medallion_pipeline.id}
              - "--catalog"
              - ${var.catalog_name}
              - "--environment"
              - ${var.env}

# Code sync configuration (files excluded from deployment)
sync:
  exclude:
    - .git/
    - .gitignore
    - .venv/
    - __pycache__/
    - .pytest_cache/
    - tests/