name: Maven Market Lakehouse CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------------------------------------
  # Stage 1: Quality Assurance (Linting & Unit Testing)
  # -----------------------------------------------------------------
  test-and-lint:
    name: Code QA & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pyyaml pandas

      - name: Run Flake8 Code Linting
        run: |
          # Stop build on syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit zero treats warnings as non-fatal
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v

  # -----------------------------------------------------------------
  # Stage 2: Databricks Asset Bundle Deploy (Dev / Prod)
  # -----------------------------------------------------------------
  deploy-bundle:
    name: Validate & Deploy DABs
    needs: test-and-lint
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.221.0

      - name: Validate DAB Bundle Syntax
        run: |
          databricks bundle validate

      - name: Deploy to Dev Target (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          databricks bundle deploy -t dev

      - name: Deploy to Production Target (Merge to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          databricks bundle deploy -t prod